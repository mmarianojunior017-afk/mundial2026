<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial 2026</title>
<style>
:root {
  --bg: #0a0f1e;
  --card: #131c30;
  --card2: #1a243c;
  --border: #1e2d4a;
  --green: #00a651;
  --green-dark: #006847;
  --red: #e03030;
  --yellow: #f5c518;
  --blue: #3b82f6;
  --text: #e8edf5;
  --muted: #6b7a99;
  --live-glow: #e03030;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

/* HEADER */
.header{background:linear-gradient(135deg,#0a1628 0%,#0d2244 50%,#0a1628 100%);padding:16px 20px;display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--green-dark);position:sticky;top:0;z-index:100}
.header-logo{width:48px;height:48px;border-radius:50%;border:2px solid var(--green)}
.header-title{flex:1}
.header-title h1{font-size:1.3rem;font-weight:700;color:#fff;letter-spacing:1px}
.header-title p{font-size:.75rem;color:var(--muted)}
.refresh-badge{font-size:.7rem;color:var(--muted);text-align:right}
.live-badge{display:inline-flex;align-items:center;gap:5px;background:#e0303022;color:var(--red);border:1px solid #e0303044;padding:3px 8px;border-radius:20px;font-size:.7rem;font-weight:700}
.live-dot{width:7px;height:7px;background:var(--red);border-radius:50%;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

/* TABS */
.tabs{display:flex;background:#0d1628;border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:80px;z-index:99}
.tab-btn{flex:1;min-width:90px;padding:13px 8px;background:none;border:none;color:var(--muted);font-size:.82rem;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:.2s;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
.tab-btn:hover{color:var(--text);background:#ffffff08}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green)}

/* CONTENT */
.content{max-width:900px;margin:0 auto;padding:16px}

/* SECTION HEADERS */
.section-header{margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.section-header h2{font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.section-header .line{flex:1;height:1px;background:var(--border)}

/* MATCH CARD */
.match-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:.2s}
.match-card:hover{border-color:#2d3f5f;background:var(--card2)}
.match-card.mexico-match{border-left:3px solid var(--green)}
.match-card.live-match{border-left:3px solid var(--red)}
.match-card.atlanta-match{border-left:3px solid var(--yellow)}

.match-meta{padding:8px 14px 4px;display:flex;justify-content:space-between;align-items:center}
.match-group{font-size:.7rem;color:var(--muted)}
.match-status-badge{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:10px}
.status-live{background:#e0303022;color:var(--red);border:1px solid #e0303055;display:inline-flex;align-items:center;gap:4px}
.status-ft{background:#ffffff11;color:var(--muted)}
.status-upcoming{background:#3b82f611;color:var(--blue)}

.match-main{padding:10px 14px;display:flex;align-items:center;gap:10px}
.team-block{flex:1;display:flex;align-items:center;gap:8px}
.team-block.right{flex-direction:row-reverse;text-align:right}
.team-logo{width:34px;height:34px;object-fit:contain}
.team-name{font-size:.9rem;font-weight:600}
.team-abbr{font-size:.75rem;color:var(--muted);display:none}
.score-block{min-width:70px;text-align:center}
.score{font-size:1.6rem;font-weight:800;letter-spacing:2px;color:#fff}
.score-vs{font-size:.85rem;color:var(--muted)}
.match-clock{font-size:.7rem;color:var(--red);font-weight:700}

.match-venue{padding:0 14px 6px;font-size:.7rem;color:var(--muted)}

/* EVENTS */
.match-events{padding:6px 14px 8px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px}
.event-pill{font-size:.72rem;padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
.ev-goal{background:#00a65115;color:var(--green);border:1px solid #00a65133}
.ev-own_goal{background:#e0303015;color:#ff6666;border:1px solid #e0303033}
.ev-penalty{background:#00a65115;color:#55ffaa;border:1px solid #00a65133}
.ev-yellow_card{background:#f5c51815;color:var(--yellow);border:1px solid #f5c51833}
.ev-red_card{background:#e0303015;color:var(--red);border:1px solid #e0303033}

/* STATS BAR */
.match-stats{padding:6px 14px 10px;border-top:1px solid var(--border)}
.stat-row{margin:4px 0;display:flex;align-items:center;gap:6px;font-size:.7rem}
.stat-label{color:var(--muted);width:80px;text-align:right}
.stat-bar-wrap{flex:1;display:flex;gap:2px;height:5px;border-radius:3px;overflow:hidden}
.stat-bar-l{background:var(--green);border-radius:3px 0 0 3px;transition:.5s}
.stat-bar-r{background:#3b82f6;border-radius:0 3px 3px 0;transition:.5s}
.stat-val{color:var(--muted);width:80px}

/* STANDINGS */
.group-block{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.group-title{padding:10px 14px;font-size:.8rem;font-weight:700;color:var(--green);background:var(--card2);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border)}
.standings-table{width:100%;border-collapse:collapse;font-size:.78rem}
.standings-table th{padding:6px 10px;color:var(--muted);font-weight:600;text-align:center;border-bottom:1px solid var(--border)}
.standings-table th:first-child{text-align:left}
.standings-table td{padding:7px 10px;text-align:center;border-bottom:1px solid #0d1628}
.standings-table td:first-child{text-align:left}
.standings-table tr:last-child td{border-bottom:none}
.standings-table tr.qualify{background:#00a65108}
.standings-table tr.host-team .team-cell{color:var(--green);font-weight:700}
.standings-table .team-cell{display:flex;align-items:center;gap:7px}
.standings-table .team-logo-sm{width:22px;height:22px;object-fit:contain}
.pts-cell{font-weight:700;color:#fff}

/* MEXICO TAB */
.mexico-header{background:linear-gradient(135deg,#006847 0%,#004a33 100%);border-radius:12px;padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:16px}
.mexico-header img{width:60px;height:60px;object-fit:contain}
.mexico-header h2{font-size:1.2rem;font-weight:800;color:#fff}
.mexico-header p{font-size:.8rem;color:#ffffffaa}
.mexico-stat-row{display:flex;gap:16px;margin-top:10px}
.mx-stat{text-align:center;background:#00000033;border-radius:8px;padding:8px 16px}
.mx-stat-num{font-size:1.4rem;font-weight:800;color:#fff}
.mx-stat-label{font-size:.65rem;color:#ffffffaa}

/* SEMIS TAB */
.semis-header{background:linear-gradient(135deg,#1a1a00 0%,#2a2a00 100%);border:1px solid #f5c51833;border-radius:12px;padding:16px;margin-bottom:16px;text-align:center}
.semis-header h2{font-size:1.1rem;font-weight:700;color:var(--yellow)}
.semis-header p{font-size:.8rem;color:var(--muted);margin-top:4px}
.atlanta-badge{display:inline-block;background:#f5c51822;border:1px solid var(--yellow);border-radius:6px;padding:2px 8px;font-size:.7rem;color:var(--yellow);margin-top:6px}

/* EMPTY / LOADING */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h3{font-size:1rem;margin-bottom:8px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{position:fixed;inset:0;background:#0a0f1ecc;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:12px;font-size:.9rem;color:var(--muted)}

.tab-content{display:none}
.tab-content.active{display:block}

@media(max-width:480px){
  .team-name{font-size:.78rem}
  .score{font-size:1.3rem}
  .tab-btn{font-size:.7rem;padding:11px 5px}
  .mexico-stat-row{gap:8px}
}
</style>
</head>
<body>

<div class="header">
  <img class="header-logo" src="https://a.espncdn.com/i/leaguelogos/soccer/500/4.png" alt="WC">
  <div class="header-title">
    <h1>⚽ MUNDIAL 2026</h1>
    <p>México · USA · Canadá</p>
  </div>
  <div class="refresh-badge" id="refresh-info">Cargando...</div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('calendario')">📅 Calendario</button>
  <button class="tab-btn" onclick="showTab('mexico')">🇲🇽 México</button>
  <button class="tab-btn" onclick="showTab('grupos')">📊 Grupos</button>
  <button class="tab-btn" onclick="showTab('semifinales')">🏆 Semis</button>
</div>

<div class="content">
  <div id="tab-calendario" class="tab-content active"></div>
  <div id="tab-mexico"     class="tab-content"></div>
  <div id="tab-grupos"     class="tab-content"></div>
  <div id="tab-semifinales" class="tab-content"></div>
</div>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <span>Cargando partidos del Mundial...</span>
</div>

<script>
const BASE_URL   = '';          // mismo servidor
const MEXICO_ID  = '203';
const USA_ID     = '660';
const CANADA_ID  = '206';
const HOST_IDS   = new Set([MEXICO_ID, USA_ID, CANADA_ID]);
const ATLANTA_KW = ['atlanta', 'mercedes-benz'];

let allMatches   = [];
let activeTab    = 'calendario';
let refreshTimer = null;
let liveCount    = 0;

// ── Utilidades ─────────────────────────────────────────────────────────────
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}
function dateKey(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX',{year:'numeric',month:'2-digit',day:'2-digit'});
}
function isLive(m)      { return m.status.state === 'in'; }
function isCompleted(m) { return m.status.completed; }
function isMexicoMatch(m){ return m.home.id===MEXICO_ID || m.away.id===MEXICO_ID; }
function isAtlanta(m)   { return ATLANTA_KW.some(k=>(m.venue||'').toLowerCase().includes(k)); }

function evIcon(type){
  return {goal:'⚽',own_goal:'⚽🔄',penalty:'⚽(P)',yellow_card:'🟨',red_card:'🟥'}[type]||'';
}
function evClass(type){
  return `event-pill ev-${type}`;
}

// ── Tarjeta de partido ─────────────────────────────────────────────────────
function matchCard(m, opts={}){
  const live      = isLive(m);
  const done      = isCompleted(m);
  const mexico    = isMexicoMatch(m);
  const atlanta   = isAtlanta(m);
  let cardClass   = 'match-card';
  if(live)    cardClass += ' live-match';
  else if(mexico) cardClass += ' mexico-match';
  else if(atlanta) cardClass += ' atlanta-match';

  // Status badge
  let badge = '';
  if(live){
    badge = `<span class="match-status-badge status-live"><span class="live-dot"></span>${m.status.clock||m.status.detail}</span>`;
  } else if(done){
    badge = `<span class="match-status-badge status-ft">FT</span>`;
  } else {
    badge = `<span class="match-status-badge status-upcoming">${fmtTime(m.date)}</span>`;
  }

  // Score
  const scoreHTML = done||live
    ? `<div class="score">${m.home.score??'–'} <span style="color:var(--muted);font-size:.9rem">-</span> ${m.away.score??'–'}</div>`
    : `<div class="score-vs">vs</div>`;

  // Logo helper
  const logo = (t,side)=>{
    const src = t.logo ? `<img class="team-logo" src="${t.logo}" onerror="this.style.display='none'" alt="${t.abbr}">` : `<span style="font-size:1.4rem">🏳</span>`;
    return src;
  };

  // Events
  let evHTML = '';
  if(m.events && m.events.length){
    const pills = m.events.map(e=>{
      const side = e.team_id===m.home.id ? m.home.abbr : m.away.abbr;
      return `<span class="${evClass(e.type)}">${evIcon(e.type)} ${e.minute} ${e.player||''} <span style="color:var(--muted)">[${side}]</span></span>`;
    }).join('');
    evHTML = `<div class="match-events">${pills}</div>`;
  }

  // Stats bar (possession)
  let statsHTML = '';
  if(done||live){
    const hp = parseFloat(m.home.stats.possession)||50;
    const ap = parseFloat(m.away.stats.possession)||(100-hp);
    const hs = m.home.stats.shots||'0', as2 = m.away.stats.shots||'0';
    const hsog = m.home.stats.sog||'0', asog = m.away.stats.sog||'0';
    statsHTML = `<div class="match-stats">
      <div class="stat-row">
        <span class="stat-label" style="color:var(--green)">${hp}%</span>
        <div class="stat-bar-wrap"><div class="stat-bar-l" style="width:${hp}%"></div><div class="stat-bar-r" style="width:${ap}%"></div></div>
        <span class="stat-val">${ap}% <span style="color:var(--muted);font-size:.65rem">posesión</span></span>
      </div>
      <div class="stat-row" style="font-size:.68rem;color:var(--muted)">
        Tiros: ${hs} (${hsog} al arco) &nbsp;|&nbsp; ${as2} (${asog} al arco)
      </div>
    </div>`;
  }

  const groupLabel = m.group ? m.group.replace('FIFA World Cup, ','') : '';
  const venueStr = [m.venue, m.city].filter(Boolean).join(' · ');

  return `<div class="${cardClass}">
    <div class="match-meta">
      <span class="match-group">${groupLabel}</span>
      ${badge}
    </div>
    <div class="match-main">
      <div class="team-block">
        ${logo(m.home,'left')}
        <span class="team-name">${m.home.name||m.home.abbr||'?'}</span>
      </div>
      <div class="score-block">${scoreHTML}</div>
      <div class="team-block right">
        <span class="team-name">${m.away.name||m.away.abbr||'?'}</span>
        ${logo(m.away,'right')}
      </div>
    </div>
    <div class="match-venue">🏟 ${venueStr}</div>
    ${evHTML}
    ${statsHTML}
  </div>`;
}

// ── Calcular tabla de grupos ──────────────────────────────────────────────
function computeStandings(matches){
  const groups = {};
  const groupStage = matches.filter(m=>m.slug==='group-stage'&&m.status.completed);
  groupStage.forEach(m=>{
    const gKey = (m.group||'').replace('FIFA World Cup, ','').trim()||'Otro';
    if(!groups[gKey]) groups[gKey]={};
    [m.home, m.away].forEach(t=>{
      if(!t.id) return;
      if(!groups[gKey][t.id]) groups[gKey][t.id]={id:t.id,name:t.name,abbr:t.abbr,logo:t.logo,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};
    });
    const hs = parseInt(m.home.score)||0;
    const as2= parseInt(m.away.score)||0;
    const ht = groups[gKey][m.home.id];
    const at = groups[gKey][m.away.id];
    if(!ht||!at) return;
    ht.P++; ht.GF+=hs; ht.GA+=as2; at.P++; at.GF+=as2; at.GA+=hs;
    if(hs>as2)     {ht.W++;ht.Pts+=3;at.L++;}
    else if(hs<as2){at.W++;at.Pts+=3;ht.L++;}
    else           {ht.D++;ht.Pts++;at.D++;at.Pts++;}
    ht.GD=ht.GF-ht.GA; at.GD=at.GF-at.GA;
  });
  return groups;
}

// ── Renderizar tabs ────────────────────────────────────────────────────────
function renderCalendario(matches){
  const el = document.getElementById('tab-calendario');
  if(!matches.length){el.innerHTML='<div class="empty"><div class="spinner"></div><p>Cargando...</p></div>';return;}

  // Group by date
  const byDate = {};
  matches.forEach(m=>{
    const k = dateKey(m.date);
    if(!byDate[k]) byDate[k]={label:fmtDate(m.date),matches:[]};
    byDate[k].matches.push(m);
  });

  // Find round
  const getRound = m=>{
    const s=m.slug||'';
    if(s.includes('group'))return 'Fase de Grupos';
    if(s.includes('32')||s.includes('round-of'))return 'Ronda de 32';
    if(s.includes('16'))return 'Octavos de Final';
    if(s.includes('quarter'))return 'Cuartos de Final';
    if(s.includes('semi'))return 'Semifinales';
    if(s.includes('final'))return 'Final';
    return '';
  };

  let html='';
  Object.keys(byDate).sort().forEach(k=>{
    const {label,matches:ms}=byDate[k];
    html+=`<div class="section-header"><h2>📅 ${label}</h2><div class="line"></div></div>`;
    ms.forEach(m=>{ html+=matchCard(m); });
  });
  el.innerHTML=html;
}

function renderMexico(matches){
  const el = document.getElementById('tab-mexico');
  const mxMatches = matches.filter(isMexicoMatch);
  if(!mxMatches.length){
    el.innerHTML='<div class="empty"><h3>No hay partidos de México aún</h3></div>';
    return;
  }

  // Stats
  const completed = mxMatches.filter(m=>m.status.completed);
  let W=0,D=0,L=0,GF=0,GA=0;
  completed.forEach(m=>{
    const isMxHome = m.home.id===MEXICO_ID;
    const mxScore  = parseInt(isMxHome?m.home.score:m.away.score)||0;
    const rivScore = parseInt(isMxHome?m.away.score:m.home.score)||0;
    GF+=mxScore; GA+=rivScore;
    if(mxScore>rivScore)W++;
    else if(mxScore<rivScore)L++;
    else D++;
  });

  const mxLogoSrc = mxMatches[0]?.home.id===MEXICO_ID
    ? mxMatches[0].home.logo
    : mxMatches[0]?.away.logo;

  let html=`<div class="mexico-header">
    <img src="${mxLogoSrc||''}" onerror="this.src=''" alt="MEX">
    <div>
      <h2>🇲🇽 Selección Mexicana</h2>
      <p>Mundial 2026 · Fase de Grupos</p>
      <div class="mexico-stat-row">
        <div class="mx-stat"><div class="mx-stat-num" style="color:#00ff88">${W}</div><div class="mx-stat-label">Victorias</div></div>
        <div class="mx-stat"><div class="mx-stat-num">${D}</div><div class="mx-stat-label">Empates</div></div>
        <div class="mx-stat"><div class="mx-stat-num" style="color:var(--red)">${L}</div><div class="mx-stat-label">Derrotas</div></div>
        <div class="mx-stat"><div class="mx-stat-num">${GF}-${GA}</div><div class="mx-stat-label">GF-GC</div></div>
      </div>
    </div>
  </div>`;

  mxMatches.forEach(m=>{ html+=matchCard(m); });
  el.innerHTML=html;
}

function renderGrupos(matches){
  const el = document.getElementById('tab-grupos');
  const standings = computeStandings(matches);
  const groupKeys = Object.keys(standings).sort((a,b)=>{
    // Host groups first
    const aHasHost = Object.values(standings[a]||{}).some(t=>HOST_IDS.has(t.id));
    const bHasHost = Object.values(standings[b]||{}).some(t=>HOST_IDS.has(t.id));
    if(aHasHost&&!bHasHost)return-1;
    if(!aHasHost&&bHasHost)return 1;
    return a.localeCompare(b);
  });

  if(!groupKeys.length){
    // Show info card if no completed matches yet
    el.innerHTML='<div class="empty"><h3>Los grupos se calcularán conforme avancen los partidos</h3><p style="margin-top:8px;font-size:.8rem">Vuelve cuando haya resultados completados</p></div>';
    return;
  }

  let html='';
  groupKeys.forEach(gKey=>{
    const teams = Object.values(standings[gKey]).sort((a,b)=>{
      if(b.Pts!==a.Pts)return b.Pts-a.Pts;
      if(b.GD !==a.GD )return b.GD-a.GD;
      return b.GF-a.GF;
    });
    html+=`<div class="group-block">
      <div class="group-title">⚽ ${gKey}</div>
      <table class="standings-table">
        <thead><tr>
          <th>Equipo</th><th>J</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GA</th><th>DG</th><th>Pts</th>
        </tr></thead>
        <tbody>`;
    teams.forEach((t,i)=>{
      const isHost = HOST_IDS.has(t.id);
      const qualClass = i<2?'qualify':'';
      const hostClass = isHost?'host-team':'';
      const logoImg = t.logo ? `<img class="team-logo-sm" src="${t.logo}" onerror="this.style.display='none'" alt="${t.abbr}">` : '';
      const gd = t.GD>=0?`+${t.GD}`:t.GD;
      html+=`<tr class="${qualClass} ${hostClass}">
        <td><div class="team-cell">${logoImg}<span>${t.name||t.abbr}</span></div></td>
        <td>${t.P}</td><td>${t.W}</td><td>${t.D}</td><td>${t.L}</td>
        <td>${t.GF}</td><td>${t.GA}</td><td>${gd}</td>
        <td class="pts-cell">${t.Pts}</td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;
  });

  if(!html) html='<div class="empty"><h3>Sin datos de grupos aún</h3></div>';
  el.innerHTML=html;
}

function renderSemifinales(matches){
  const el   = document.getElementById('tab-semifinales');
  const semis = matches.filter(m=>{
    const date = m.date||'';
    return date.includes('2026-07-14')||date.includes('2026-07-15')
      ||(m.slug||'').includes('semi');
  });

  let html = `<div class="semis-header">
    <h2>🏆 Semifinales del Mundial</h2>
    <p>14 y 15 de Julio de 2026</p>
    <span class="atlanta-badge">⭐ Mercedes-Benz Stadium, Atlanta</span>
  </div>`;

  if(!semis.length){
    html+=`<div class="empty">
      <h3>Por definirse</h3>
      <p style="margin-top:8px;font-size:.8rem">Los equipos semifinalistas se conocerán en cuartos de final (9-11 Jul)</p>
      <p style="margin-top:16px;color:var(--yellow);font-size:.8rem">⭐ Una semifinal se jugará en el Mercedes-Benz Stadium de Atlanta</p>
    </div>`;
  } else {
    semis.forEach(m=>{
      const atl = isAtlanta(m);
      html += (atl?`<div style="margin-bottom:4px;text-align:center"><span class="atlanta-badge">⭐ Atlanta</span></div>`:'')
        + matchCard(m);
    });
  }
  el.innerHTML=html;
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function showTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(el=>{
    if(el.textContent.toLowerCase().includes(tab.slice(0,4).toLowerCase()))
      el.classList.add('active');
  });
  renderAll();
}

// ── Fetch & refresh ────────────────────────────────────────────────────────
async function fetchMatches(){
  try{
    const r = await fetch(`${BASE_URL}/api/matches`);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    allMatches = await r.json();
    liveCount  = allMatches.filter(isLive).length;
    renderAll();
    updateRefreshBadge();
  } catch(e){
    console.error('Error cargando partidos:',e);
    document.getElementById('refresh-info').textContent='Error al cargar – reintentando...';
  }
  document.getElementById('loading').style.display='none';

  // Auto-refresh
  clearTimeout(refreshTimer);
  const delay = liveCount>0 ? 30000 : 120000;
  refreshTimer = setTimeout(fetchMatches, delay);
}

function updateRefreshBadge(){
  const now = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  const badge = document.getElementById('refresh-info');
  if(liveCount>0){
    badge.innerHTML=`<span class="live-badge"><span class="live-dot"></span>${liveCount} EN VIVO</span>`;
  } else {
    badge.textContent=`Act. ${now}`;
  }
}

function renderAll(){
  switch(activeTab){
    case 'calendario':  renderCalendario(allMatches); break;
    case 'mexico':      renderMexico(allMatches);     break;
    case 'grupos':      renderGrupos(allMatches);     break;
    case 'semifinales': renderSemifinales(allMatches);break;
  }
}

// Fix tab button active state
document.querySelectorAll('.tab-btn').forEach((btn,i)=>{
  const tabs=['calendario','mexico','grupos','semifinales'];
  btn.onclick=()=>showTab(tabs[i]);
});

// Init
fetchMatches();
</script>
</body>
</html>
